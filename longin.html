<!-- Login Tab -->
        <div id="auth-login" class="auth-tab active">
          <h2>Entrar</h2>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="seu@email.com">
          </div>
          <div class="form-group">
            <label>Senha</label>
            <input type="password" id="loginPassword" placeholder="Sua senha">
          </div>
          <button class="btn-primary" onclick="handleLogin()">Entrar</button>
          <button class="btn-secondary" style="width:100%; margin-top:0.5rem;" onclick="backToUserType()">Voltar</button>
        </div>
